name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contract, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      POSTGRES_PASSWORD: ci-postgres-password
      # This is a non-secret validation value: 32 bytes of `a`, Base64 encoded.
      FUNCTIONS_SECRET_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache-dependency-path: services/api/go.sum

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run application quality gate
        run: npm run check

      - name: Validate all Compose profiles
        run: docker compose --profile console --profile observability config --quiet

      - name: Validate smoke script syntax
        run: bash -n deploy/smoke.sh
