server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index _shell.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The console bundle can be built with an empty VITE_API_URL so the
    # browser calls the Go API relative to its own origin. Compose DNS
    # (127.0.0.11) is re-resolved so an API restart cannot strand the proxy.
    # Stripping Origin mirrors the dev proxy behavior: same-origin requests
    # keep working without adding public hostnames to CONSOLE_CORS_ORIGINS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        # Realtime SSE streams need buffering disabled and a long read window.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Health and readiness reflect the API so the tunnel shows the stack's
    # real state; the container healthcheck rides the same paths.
    location = /healthz {
        proxy_pass $api_upstream;
        proxy_set_header Origin "";
        add_header Cache-Control "no-store" always;
    }
    location = /readyz {
        proxy_pass $api_upstream;
        proxy_set_header Origin "";
        add_header Cache-Control "no-store" always;
    }

    # TanStack Start asset filenames contain content hashes and can be cached
    # safely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # TanStack Router owns client-side navigation; unknown document paths must
    # resolve to TanStack Start's SPA shell while missing static assets remain
    # 404s.
    location / {
        try_files $uri $uri/ /_shell.html;
        add_header Cache-Control "no-cache" always;
    }
}
