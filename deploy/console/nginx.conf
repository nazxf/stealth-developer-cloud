server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index _shell.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The container healthcheck must not be routed through the SPA fallback.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok"}';
    }

    # TanStack Start asset filenames contain content hashes and can be cached
    # safely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # TanStack Router owns client-side navigation; unknown document paths must
    # resolve to TanStack Start's SPA shell while missing static assets remain
    # 404s.
    location / {
        try_files $uri $uri/ /_shell.html;
        add_header Cache-Control "no-cache" always;
    }
}
